version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Kleinere Updates bündeln, Major-Versionen einzeln prüfen
      astro:
        patterns: ["astro", "@astrojs/*"]
        update-types: [minor, patch]
      tests:
        patterns: ["vitest", "@playwright/test", "@axe-core/*", "jsdom"]
        update-types: [minor, patch]
      werkzeuge:
        patterns: ["@biomejs/*", "typescript", "@types/*", "exceljs"]
        update-types: [minor, patch]
      laufzeit:
        patterns: ["d3", "d3-sankey", "@fontsource-variable/*"]
        update-types: [minor, patch]
    ignore:
      # @astrojs/check unterstützt TypeScript bislang nur bis 6.x; erst mit Astro-Unterstützung anheben
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Typen passend zur Laufzeit: Node 24 (.nvmrc, Vercel, CI); Major nur zusammen mit der Node-Version
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    # Conventional Commits: „build(deps): …“ und „build(deps-dev): …“
    commit-message:
      prefix: build
      prefix-development: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Conventional Commits: „ci(deps): …“
    commit-message:
      prefix: ci
      include: scope
