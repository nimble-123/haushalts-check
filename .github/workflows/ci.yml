name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # E2E und Lighthouse nur, wenn ein PR die ausgelieferte Seite oder ihre Tests betrifft.
  # Auf main laufen immer alle Prüfungen.
  bereiche:
    name: Betroffene Bereiche
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      seite: ${{ steps.pruefen.outputs.seite }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: pruefen
        name: Betrifft die Änderung die Seite?
        env:
          EREIGNIS: ${{ github.event_name }}
        run: |
          if [ "$EREIGNIS" != "pull_request" ]; then
            echo "seite=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD ist der Merge-Commit des PR, HEAD^1 der aktuelle Stand des Ziel-Branches
          git diff --name-only HEAD^1 HEAD | tee geaendert.txt
          SEITE='^(src/|public/|design-system/(tokens\.json|components/bundle\.css)|tests/e2e/|astro\.config\.ts|playwright\.config\.ts|lighthouserc\.json|package(-lock)?\.json|tsconfig\.json|\.nvmrc|\.github/workflows/ci\.yml)'
          if grep -v '\.test\.ts$' geaendert.txt | grep -qE "$SEITE"; then
            echo "seite=true" >> "$GITHUB_OUTPUT"
          else
            echo "seite=false" >> "$GITHUB_OUTPUT"
            echo "Keine Änderung an der Seite: E2E und Lighthouse entfallen." >> "$GITHUB_STEP_SUMMARY"
          fi

  pruefen:
    name: Lint, Typen, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Commit-Nachrichten (Conventional Commits)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Lint und Format (Biome)
        run: npm run lint
      - name: Typen (astro check + tsc)
        run: npm run typecheck
      - name: Unit- und Integrationstests (Vitest)
        run: npm test
      - name: Build
        run: npm run build
      # E2E und Lighthouse prüfen genau diesen Build, statt selbst neu zu bauen
      - name: Build für die weiteren Jobs
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    name: E2E (Playwright, Desktop und Mobil)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [pruefen, bereiche]
    if: needs.bereiche.outputs.seite == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build aus „Lint, Typen, Tests, Build“
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Playwright-Version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Chromium aus dem Cache
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Chromium für Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Systempakete für Chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: E2E-Tests
        run: npm run test:e2e
        env:
          E2E_OHNE_BUILD: "1"
      - name: Bericht bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse (Performance, Barrierefreiheit, Best Practices, SEO)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [pruefen, bereiche]
    if: needs.bereiche.outputs.seite == 'true'
    permissions:
      contents: read
      statuses: write # Lighthouse CI setzt je Seite einen Commit-Status mit Link zum Bericht
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Lighthouse CI kommt per npx in fester Version; npm ci ist hier nicht nötig
      - name: Build aus „Lint, Typen, Tests, Build“
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Lighthouse CI gegen den Build
        run: npm run lhci
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
