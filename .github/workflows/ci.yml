name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Lint, Typen, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Commit-Nachrichten (Conventional Commits)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Lint und Format (Biome)
        run: npm run lint
      - name: Typen (astro check + tsc)
        run: npm run typecheck
      - name: Unit- und Integrationstests (Vitest)
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright, Desktop und Mobil)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: pruefen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Chromium für Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E-Tests
        run: npm run test:e2e
      - name: Bericht bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse (Performance, Barrierefreiheit, Best Practices, SEO)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pruefen
    permissions:
      contents: read
      statuses: write # Lighthouse CI setzt je Seite einen Commit-Status mit Link zum Bericht
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lighthouse CI gegen den Build
        run: npm run lighthouse
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
