<!-- @dsCard height=288 -->
<div class="cover">
  <svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
    <!--
      Blöcke: marker 18 Kästchen, cat-soz 14, cat-for 8, cat-sich 6, cat-zins 4, surface 10 – zusammenhängende Felder im Raster.
      Anordnung: ein Raster 10 × 6 rechts von x = 528, oben bündig, gefüllt zeilenweise wie die „100 €“-Grafik.
      Muster: geometrische Kacheln aus radius-cell, weil das System selbst aus Kästchen (1 €) besteht.
      Maße: Kästchen 36px, Abstand space-1 (4px), Teilung 40px, Ecken radius-cell (2px).
    -->
    <g id="cells"></g>
  </svg>
  <div class="name">
    <h1>Raster</h1>
    <p>Das Design-System des Haushalts-Checks. Ein Kästchen ist ein Euro.</p>
  </div>
</div>
<style>
  html, body { margin: 0; background: var(--paper); }
  .cover { position: relative; width: 960px; height: 288px; background: var(--paper); overflow: hidden; }
  svg { position: absolute; inset: 0; }
  .c { rx: var(--radius-cell); }
  .marker { fill: var(--marker); } .soz { fill: var(--cat-soz); } .for { fill: var(--cat-for); }
  .sich { fill: var(--cat-sich); } .zins { fill: var(--cat-zins); } .leer { fill: var(--surface); }
  .name { position: absolute; left: 40px; bottom: 36px; max-width: 440px; }
  h1 { margin: 0; font: 700 120px/0.92 var(--font-display); letter-spacing: -0.03em; color: var(--ink); }
  p { margin: 14px 0 0; font: 400 14px/1.4 var(--font-text); color: var(--ink-2); }
</style>
<script>
  const felder = [['marker', 18], ['soz', 14], ['for', 8], ['sich', 6], ['zins', 4], ['leer', 10]];
  const klassen = felder.flatMap(([k, n]) => Array(n).fill(k));
  const g = document.getElementById('cells');
  const ns = 'http://www.w3.org/2000/svg';
  klassen.forEach((k, i) => {
    const r = document.createElementNS(ns, 'rect');
    r.setAttribute('x', 528 + (i % 10) * 40);
    r.setAttribute('y', 24 + Math.floor(i / 10) * 40);
    r.setAttribute('width', 36); r.setAttribute('height', 36);
    r.setAttribute('class', 'c ' + k);
    g.appendChild(r);
  });
</script>
